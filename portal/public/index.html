<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coding Portal</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Coding portal</h1>
        <p>Run &amp; review tests</p>
      </header>
      <nav id="problem-list" class="problem-list" aria-label="Problems"></nav>
    </aside>

    <main class="main">
      <div id="empty-state" class="empty-state">Select a problem</div>

      <div id="workspace" class="workspace" hidden>
        <div class="tab-bar" role="tablist" aria-label="Problem views">
          <button
            type="button"
            class="tab active"
            role="tab"
            id="tab-readme"
            aria-controls="panel-readme"
            aria-selected="true"
            data-tab="readme"
          >
            README
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            id="tab-tests"
            aria-controls="panel-tests"
            aria-selected="false"
            data-tab="tests"
          >
            Tests
          </button>
        </div>

        <section
          id="panel-readme"
          class="tab-panel active"
          role="tabpanel"
          aria-labelledby="tab-readme"
        >
          <article id="markdown" class="markdown"></article>
        </section>

        <section
          id="panel-tests"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-tests"
          hidden
        >
          <div class="tests-layout" id="tests-layout">
            <div class="tests-pane" id="tests-pane">
              <div class="tests-toolbar">
                <h2>Tests</h2>
                <div class="toolbar-actions">
                  <button type="button" id="btn-stop" class="btn btn-ghost" disabled>
                    Stop
                  </button>
                  <button type="button" id="btn-run-all" class="btn btn-run">RUN all</button>
                </div>
              </div>
              <div class="tests-table-wrap">
                <table class="tests-table" id="test-table">
                  <thead>
                    <tr>
                      <th class="col-status">Status</th>
                      <th class="col-name">Name</th>
                      <th class="col-action"></th>
                    </tr>
                  </thead>
                  <tbody id="test-list"></tbody>
                </table>
              </div>
            </div>

            <div class="results-shell" id="results-shell">
              <div
                class="resize-handle"
                id="results-resize"
                role="separator"
                aria-orientation="horizontal"
                aria-label="Resize output pane"
                tabindex="0"
              ></div>
              <div class="terminal-pane" id="terminal-pane">
                <div class="terminal-header">
                  <div class="terminal-header-left">
                    <button
                      type="button"
                      id="btn-collapse-results"
                      class="btn-collapse"
                      aria-expanded="true"
                      aria-controls="terminal-body"
                      title="Collapse output"
                    >
                      ▾
                    </button>
                    <span>Output</span>
                  </div>
                  <span id="run-status" class="run-status"></span>
                </div>
                <div class="terminal-body" id="terminal-body">
                  <div id="run-summary" class="run-summary" hidden></div>
                  <pre id="terminal" class="terminal" aria-live="polite"></pre>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
